name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/release/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm i -g npm@11.6.2

      - name: Print tool versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Install isolated release tools
        run: npm run tools:release:ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium headless shell for smoke tests
        timeout-minutes: 15
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify package before release
        run: npm run check:release

      - name: Create release PR or publish to npm
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: release package versions"
          pr-title: "chore: release package versions"
          github-token: ${{ secrets.GITHUB_TOKEN }}
